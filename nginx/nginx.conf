# =============================================================================
# Parking Perks — nginx reverse proxy
#
# TEACHING NOTE: Why nginx at all?
#
# Without this, the browser sees two different origins:
#   Frontend: http://parking-perks.ubc.ca       (port 80)
#   API:      http://parking-perks.ubc.ca:8000   (different port = different origin)
#
# The Same-Origin Policy blocks cross-origin requests unless the server
# sends CORS headers. Rather than punching holes in the SOP with CORS,
# we use nginx to make EVERYTHING appear to come from one origin.
# Nginx routes requests internally — the browser never knows FastAPI exists.
#
# This also means:
#   - FastAPI never needs to be publicly exposed (only nginx is)
#   - SSL is terminated at nginx (one cert, one place)
#   - Static React files are served by nginx (much faster than Python)
#   - Compression and caching are handled here (not in the app)
#
# HOW TO USE:
#   1. Build the React app: cd frontend && npm run build
#   2. Copy dist/ to /var/www/parking-perks/
#   3. Place this file at /etc/nginx/sites-available/parking-perks
#   4. sudo ln -s /etc/nginx/sites-available/parking-perks /etc/nginx/sites-enabled/
#   5. sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    server_name parking-perks.ok.ubc.ca;

    # Serve React build (static files)
    root /var/www/parking-perks;
    index index.html;

    # React Router support: any URL that doesn't match a file
    # falls through to index.html. React Router then handles it client-side.
    # Without this, refreshing the page on a deep URL returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to FastAPI.
    # trailing slash on proxy_pass strips the /api prefix before forwarding.
    # FastAPI receives: /analyze, /draw, /history — not /api/analyze etc.
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Increase timeout for the analyze endpoint — it calls three external
        # systems and may take 10–30 seconds on slow network days.
        proxy_read_timeout 60s;
    }

    # Security headers — defense-in-depth even inside the VPN.
    # These prevent a class of browser-based attacks even if someone
    # manages to get a malicious page loaded in the same browser session.
    add_header X-Frame-Options          DENY;
    add_header X-Content-Type-Options   nosniff;
    add_header Referrer-Policy          strict-origin-when-cross-origin;

    # Compress text responses. Typically cuts JS/JSON payload 70-80%.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Cache static assets (JS/CSS with content hashes) for 1 year.
    # Vite adds content hashes to filenames, so this is safe.
    location ~* \.(js|css|png|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

